- name: add_flow
  description: "\n    Add a flow rule to a device with comprehensive criteria and instruction support.\n\n    Args:\n\
    \        device_id: Device ID to add the flow to\n        priority: Flow priority (higher values = higher priority)\n\
    \        timeout: Flow timeout in seconds (0 for no timeout)\n        is_permanent: Whether the flow is permanent\n\
    \        criteria: List of criteria dictionaries. Each criterion must have 'type' and associated fields.\n \
    \               For example: [{\"type\": \"ETH_TYPE\", \"ethType\": \"0x88cc\"},\n                         \
    \   {\"type\": \"IN_PORT\", \"port\": \"1\"}]\n        instructions: List of instruction dictionaries. Each\
    \ instruction must have 'type' and associated fields.\n                    For example: [{\"type\": \"OUTPUT\"\
    , \"port\": \"2\"},\n                                {\"type\": \"GROUP\", \"groupId\": 1}]\n    "
  schema:
    properties:
      device_id:
        title: Device Id
        type: string
      priority:
        title: Priority
        type: integer
      timeout:
        title: Timeout
        type: integer
      is_permanent:
        title: Is Permanent
        type: boolean
      criteria:
        items:
          additionalProperties: true
          type: object
        title: Criteria
        type: array
      instructions:
        items:
          additionalProperties: true
          type: object
        title: Instructions
        type: array
    required:
    - device_id
    - priority
    - timeout
    - is_permanent
    - criteria
    - instructions
    title: add_flowArguments
    type: object
  method: POST
  path: /onos/v1/flows/{device_id}
  body:
    template:
      priority: $priority
      timeout: $timeout
      isPermanent: $is_permanent
      deviceId: $device_id
      treatment:
        instructions: $instructions
      selector:
        criteria: $criteria
  reply: text
  ok_text: 'Flow added successfully: {result}'
  error_text: 'Error adding flow: {error}'
- name: add_flows
  description: "Create multiple flow rules.\n\n    Args:\n        appId: Application identifier\n        flows:\
    \ List of flow rule specifications\n\n    Creates and installs multiple flow rules.\n    "
  schema:
    properties:
      appId:
        title: Appid
        type: string
      flows:
        items:
          additionalProperties: true
          type: object
        title: Flows
        type: array
    required:
    - appId
    - flows
    title: add_flowsArguments
    type: object
  method: POST
  path: /onos/v1/flows
  body:
    wrap: flows
    arg: flows
  reply: text
  ok_text: 'Flow rules added successfully: {result}'
  error_text: 'Error adding flow rules: {error}'
- name: remove_flow
  description: "Remove a specific flow rule.\n\n    Args:\n        deviceId: Device identifier\n        flowId:\
    \ Flow rule identifier\n\n    Removes the specified flow rule.\n    "
  schema:
    properties:
      deviceId:
        title: Deviceid
        type: string
      flowId:
        anyOf:
        - type: string
        - type: integer
        title: Flowid
    required:
    - deviceId
    - flowId
    title: remove_flowArguments
    type: object
  method: DELETE
  path: /onos/v1/flows/{deviceId}/{flowId}
  quote: true
  reply: text
  ok_text: Flow {flowId} removed successfully from device {deviceId}
  error_text: 'Error removing flow {flowId} from device {deviceId}: {error}'
- name: get_network_summary
  description: Get a high-level summary of the network including devices, links, and hosts.
  schema:
    properties: {}
    title: get_network_summaryArguments
    type: object
  error_text: 'Error retrieving network summary: {error}'
  steps:
  - as: devices
    method: GET
    path: /onos/v1/devices
  - as: links
    method: GET
    path: /onos/v1/links
  - as: hosts
    method: GET
    path: /onos/v1/hosts
  - as: topology
    method: GET
    path: /onos/v1/topology
  reply:
    text:
    - '# Network Summary'
    - '- Devices: {count:devices.devices}'
    - '- Links: {count:links.links}'
    - '- Hosts: {count:hosts.hosts}'
    - '- Clusters: {topology.clusters|0}'
    - |2-

      ## Device Details
    - each: devices.devices
      line: '- {id}: {available?Available:Unavailable}, Manufacturer: {mfr|Unknown}, HW: {hw|Unknown}, SW: {sw|Unknown}'
