      deviceId:
        title: Deviceid
        type: string
    required:
    - deviceId
    title: remove_deviceArguments
    type: object
  method: DELETE
  path: /onos/v1/devices/{deviceId}
  reply: text
  ok_text: Device {deviceId} removed successfully from the inventory
  error_text: 'Error removing device {deviceId}: {error}'
