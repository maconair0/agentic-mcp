# A controller manifest in the standard form (agentic-mcp.controller/v1).
# Upload it to the agentic MCP and onboard the controller.
# MANIFEST_FORMAT.md describes every section.
manifest: agentic-mcp.controller/v1
kind: onos
title: ONOS
version: '1'
domain: packet
about: 'ONOS is a general-purpose SDN controller with a REST API under /onos/v1, and publishes a Swagger document, so its operations are read from the controller itself.'
recognise:
  operation_contains: /onos/v1/intents
api:
  style: onos
  openapi:
  - /onos/v1/docs/apis/onos/v1/swagger.json
quirks:
- Its REST API accepts only HostToHostIntent and PointToPointIntent.
- A point-to-point intent across a routed topology is answered 201 Created and then FAILS with nothing installed.
  A flow rule on each router is accepted and installed, so flow rules are how a routed network is configured.
- 'It has no operation that changes an intent or a flow in place: a change is a removal and a new one.'
- It computes no path over a link to a device that has no port enabled.
guide: A service on ONOS is either an intent (between two hosts or two connect points) or a set of flow rules, one
  per device on the path. Flow rules are what work across a routed network.
verbs:
  read_devices:
    operation: GET /onos/v1/devices
    view:
      rows: devices
      id: id
      name: annotations.name
      type: type
      available: available
  read_device:
    operation: GET /onos/v1/devices/{id}
  read_ports:
    operation: GET /onos/v1/devices/{id}/ports
  read_links:
    operation: GET /onos/v1/links
    view:
      rows: links
      src: src.device
      dst: dst.device
      src_port: src.port
      dst_port: dst.port
      state: state
  read_hosts:
    operation: GET /onos/v1/hosts
    view:
      rows: hosts
  read_services:
    operation: GET /onos/v1/intents
    view:
      rows: intents
  read_service:
    operation: GET /onos/v1/intents/{appId}/{key}
  compute_path:
    operation: GET /onos/v1/paths/{src}/{dst}
  read_statistics:
    operation: GET /onos/v1/statistics/ports
  health:
    operation: GET /onos/v1/system
  provision:
    operation: POST /onos/v1/flows/{device_id}
    arguments:
      device_id: the device the flow goes on
      priority: higher wins
      criteria: 'what to match, e.g. [{"type": "IN_PORT", "port": "1"}]'
      instructions: 'what to do, e.g. [{"type": "OUTPUT", "port": "2"}]'
    body:
      priority:
        $int: $priority
      timeout: 0
      isPermanent: true
      deviceId: $device_id
      treatment:
        instructions: $instructions
      selector:
        criteria: $criteria
  teardown:
    operation: DELETE /onos/v1/flows/{deviceId}/{flowId}
provides:
  read_devices: get_devices
  read_device: get_device
  read_ports: get_device_ports
  read_links: get_links
  read_hosts: get_hosts
  read_services: get_all_intents
  read_service: get_intent
  compute_path: get_shortest_paths
  read_statistics: get_port_statistics
  provision: add_flow
  teardown: remove_flow
  health: get_system_info
not_carried_over:
- add_buckets_to_group
- add_devices_to_region
- add_group
- add_host
- add_meter
- add_multicast_route
- add_multicast_sink
- apply_mastership_role
- change_device_port_state
- create_region
- get_diagnostics
- get_intents_by_application
- get_link_flow_statistics
- get_network_analytics
- remove_devices_from_region
- remove_multicast_route
- run_diagnostics_command
- set_port_modulation
- set_stale_link_status
tools:
- name: get_devices
  description: "Get information about all network devices.\n\n    Returns array of all discovered infrastructure\
    \ devices.\n    "
  schema:
    properties: {}
    title: get_devicesArguments
    type: object
  method: GET
  path: /onos/v1/devices
  reply: repr
  error_text: 'Error retrieving devices: {error}'
- name: get_device
  description: "Get detailed information about a specific device.\n\n    Args:\n        deviceId: ID of the device\
    \ to query\n\n    Returns details of the specified infrastructure device.\n    "
  schema:
    properties:
      deviceId:
        title: Deviceid
        type: string
    required:
    - deviceId
    title: get_deviceArguments
    type: object
  method: GET
  path: /onos/v1/devices/{deviceId}
  reply: repr
  error_text: 'Error retrieving device {deviceId}: {error}'
- name: remove_device
