  path: /onos/v1/flows/application/{appId}
  reply: text
  ok_text: All flows for application {appId} removed successfully
  error_text: 'Error removing flows for application {appId}: {error}'
- name: remove_flows
  description: "Remove a batch of flow rules.\n\n    Args:\n        flows: List of flow rule specifications to remove\n\
    \    "
  schema:
    properties:
      flows:
        items:
          additionalProperties: true
          type: object
