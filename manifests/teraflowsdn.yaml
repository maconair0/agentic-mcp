                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - context_id
            - topology_uuid
          optical_link_ids:
            type: array
            items:
              type: object
              description: LinkId
              properties:
                link_uuid:
                  type: object
                  properties:
                    uuid:
                      type: string
                  required:
                  - uuid
              required:
              - link_uuid
            description: Optical links whose common slot range is reserved.
          band:
            type: string
            description: Spectrum band, e.g. c_slots.
          n_start:
            type: integer
            description: First flex-grid slot index.
          n_end:
            type: integer
            description: Last flex-grid slot index, inclusive.
          required_slots:
            type: integer
            description: Number of contiguous slots.
          owner_id:
            type: string
            description: Agent or workflow owning the reservation.
          correlation_id:
            type: string
            description: Workflow/request correlation identifier.
          status:
            oneOf:
            - type: integer
            - type: string
            description: OpticalSpectrumReservationStatusEnum.
          service_id:
            type: object
            description: ServiceId
            properties:
              context_id:
                type: object
                description: ContextId
                properties:
                  context_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - context_uuid
              service_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - context_id
            - service_uuid
          connection_id:
            type: object
            description: ConnectionId
            properties:
              connection_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - connection_uuid
    required:
    - context_uuid
    - reservation_uuid
    - reservation
  method: PUT
  path: /tfs-api/context/{context_uuid}/optical_spectrum_reservation/{reservation_uuid}
  body:
    arg: reservation
- name: tfs_consume_optical_spectrum_reservation
  description: Consume/commit a reserved optical spectrum range after the corresponding TFS service becomes ACTIVE
    (POST /tfs-api/context/<context_uuid>/optical_spectrum_reservation/<reservation_uuid>/consume). Include service_id
    and/or connection_id evidence in the reservation body when available.
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      reservation_uuid:
        type: string
        description: Optical spectrum reservation UUID
      reservation:
        type: object
        description: OpticalSpectrumReservation. Required fields for creation are reservation_id, topology_id, optical_link_ids,
          band, n_start, n_end, required_slots, owner_id, correlation_id, and usually status=1 (RESERVED). Consume
          requests may include service_id and/or connection_id.
        properties:
          reservation_id:
            type: object
            properties:
              context_id:
                type: object
                description: ContextId
                properties:
                  context_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - context_uuid
              reservation_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - context_id
            - reservation_uuid
          topology_id:
            type: object
            description: TopologyId
            properties:
              context_id:
                type: object
                description: ContextId
                properties:
                  context_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - context_uuid
              topology_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - context_id
            - topology_uuid
          optical_link_ids:
            type: array
            items:
              type: object
              description: LinkId
              properties:
                link_uuid:
                  type: object
                  properties:
                    uuid:
                      type: string
                  required:
                  - uuid
              required:
              - link_uuid
            description: Optical links whose common slot range is reserved.
          band:
            type: string
            description: Spectrum band, e.g. c_slots.
          n_start:
            type: integer
            description: First flex-grid slot index.
          n_end:
            type: integer
            description: Last flex-grid slot index, inclusive.
          required_slots:
            type: integer
            description: Number of contiguous slots.
          owner_id:
            type: string
            description: Agent or workflow owning the reservation.
          correlation_id:
            type: string
            description: Workflow/request correlation identifier.
          status:
            oneOf:
            - type: integer
            - type: string
            description: OpticalSpectrumReservationStatusEnum.
          service_id:
            type: object
            description: ServiceId
            properties:
              context_id:
                type: object
                description: ContextId
                properties:
                  context_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - context_uuid
              service_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - context_id
            - service_uuid
          connection_id:
            type: object
            description: ConnectionId
            properties:
              connection_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - connection_uuid
    required:
    - context_uuid
    - reservation_uuid
    - reservation
  method: POST
  path: /tfs-api/context/{context_uuid}/optical_spectrum_reservation/{reservation_uuid}/consume
  body:
    arg: reservation
- name: tfs_release_optical_spectrum_reservation
  description: Release/rollback an optical spectrum reservation without deleting its audit record (POST /tfs-api/context/<context_uuid>/optical_spectrum_reservation/<reservation_uuid>/release).
    Use this on negotiation or provisioning failure.
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      reservation_uuid:
        type: string
        description: Optical spectrum reservation UUID
    required:
    - context_uuid
    - reservation_uuid
  method: POST
  path: /tfs-api/context/{context_uuid}/optical_spectrum_reservation/{reservation_uuid}/release
- name: tfs_delete_optical_spectrum_reservation
  description: Delete an optical spectrum reservation record (DELETE /tfs-api/context/<context_uuid>/optical_spectrum_reservation/<reservation_uuid>).
    Use only for cleanup when audit retention is not needed.
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      reservation_uuid:
        type: string
        description: Optical spectrum reservation UUID
    required:
    - context_uuid
    - reservation_uuid
  method: DELETE
  path: /tfs-api/context/{context_uuid}/optical_spectrum_reservation/{reservation_uuid}
- name: tfs_list_connection_ids
  description: 'List Connection IDs of a Service (GET /tfs-api/context/<context_uuid>/service/<service_uuid>/connection_ids).
    Returns: {connection_ids:[{connection_uuid:{uuid}}]}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      service_uuid:
        type: string
        description: Service UUID
    required:
    - context_uuid
    - service_uuid
  method: GET
  path: /tfs-api/context/{context_uuid}/service/{service_uuid}/connection_ids
- name: tfs_list_connections
  description: 'List Connections of a Service (GET /tfs-api/context/<context_uuid>/service/<service_uuid>/connections).
    Returns: {connections:[Connection {connection_id, service_id, path_hops_endpoint_ids:[EndPointId], sub_service_ids,
    settings:{l0:{lsp_symbolic_name}, l2:{src_mac,dst_mac,ether_type,vlan_id}, l3:{src_ip,dst_ip,dscp,protocol,ttl},
    l4:{src_port,dst_port,tcp_flags}}}]}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      service_uuid:
        type: string
        description: Service UUID
    required:
    - context_uuid
    - service_uuid
  method: GET
  path: /tfs-api/context/{context_uuid}/service/{service_uuid}/connections
- name: tfs_get_connection
  description: 'Get a Connection by UUID (GET /tfs-api/connection/<connection_uuid>). Returns: Connection {connection_id,
    service_id:{context_id,service_uuid}, path_hops_endpoint_ids:[EndPointId], sub_service_ids:[ServiceId], settings:{l0,l2,l3,l4}}'
  schema:
    type: object
    properties:
      connection_uuid:
        type: string
        description: Connection UUID
    required:
    - connection_uuid
  method: GET
  path: /tfs-api/connection/{connection_uuid}
- name: tfs_list_policyrule_ids
  description: 'List all Policy Rule IDs (GET /tfs-api/policyrule_ids). Returns: {policyrule_ids:[{policyrule_uuid:{uuid}}]}'
  schema:
    type: object
    properties: {}
    required: []
  method: GET
  path: /tfs-api/policyrule_ids
- name: tfs_list_policyrules
  description: 'List all Policy Rules (GET /tfs-api/policyrules). Returns: {policyrules:[PolicyRule]}'
  schema:
    type: object
    properties: {}
    required: []
  method: GET
  path: /tfs-api/policyrules
- name: tfs_get_policyrule
  description: 'Get a Policy Rule by UUID (GET /tfs-api/policyrule/<policyrule_uuid>). Returns: PolicyRule {policyrule_id,
    name, ...}'
  schema:
    type: object
    properties:
      policyrule_uuid:
        type: string
        description: PolicyRule UUID
    required:
    - policyrule_uuid
  method: GET
  path: /tfs-api/policyrule/{policyrule_uuid}
- name: tfs_optical_slice_delete
  description: Delete / release an OPTICAL SLICE and its associated spectrum allocations (DELETE /restconf/optical-slice/v1/service/<slice_id>).
  schema:
    type: object
    properties:
      slice_id:
        type: string
        description: Identifier of the optical slice to delete
    required:
    - slice_id
  method: DELETE
  path: /restconf/optical-slice/v1/service/{slice_id}
- name: tfs_media_channel_allocate
  description: Allocate an OPTICAL SPECTRUM SLOT (media channel) on a fiber/ROADM path (POST /restconf/media-channel/v1/service/<allocation_id>).
    A media channel = a contiguous spectrum allocation defined by center frequency and slot width (e.g., flexgrid
    n / m). This is the primary endpoint used to commit a spectrum negotiation result.
  schema:
    type: object
    properties:
      allocation_id:
        type: string
        description: Identifier for the media-channel allocation
      media_channel:
        type: object
        description: Media-channel request body. Typical fields include source/destination endpoints, center frequency
          (THz / 0.0125 THz units), slot width, lower/upper frequency bounds, optical-channel name, and target power.
    required:
    - allocation_id
    - media_channel
  method: POST
  path: /restconf/media-channel/v1/service/{allocation_id}
  body:
    arg: media_channel
- name: tfs_media_channel_release
  description: Release / tear down an optical spectrum allocation (DELETE /restconf/media-channel/v1/service/<allocation_id>).
  schema:
    type: object
    properties:
      allocation_id:
        type: string
        description: Identifier of the media channel to release
    required:
    - allocation_id
  method: DELETE
  path: /restconf/media-channel/v1/service/{allocation_id}
- name: tfs_health_check
  description: Is TeraFlowSDN's API answering.
  schema:
    type: object
    properties: {}
  steps:
  - as: ids
    method: GET
    path: /tfs-api/context_ids
  reply:
    const:
      status: ready
- name: tfs_list_optical_link_ids
  description: 'List all Optical Link IDs (GET /tfs-api/optical_link_ids if available, or derived from /tfs-api/optical_links
    in mocked mode). Returns: {link_ids:[{link_uuid:{uuid}}]}'
  schema:
    type: object
    properties: {}
    required: []
  steps:
  - as: got
    method: GET
    path: /tfs-api/optical_links
  reply:
    pluck:
      from: got.optical_links
      field: link_id
      as: link_ids
- name: tfs_optical_slice_create
  description: Create / request an end-to-end OPTICAL SLICE (POST /restconf/optical-slice/v1/service/<slice_id>).
    This is the RESTCONF optical-slice API and is distinct from TFS OPTICAL_CONNECTIVITY service provisioning through
    /tfs-api. Use this only for optical slice intents, not for optical connectivity service intents. The controller
    resolves the slice into one or more spectrum allocations (media channels) along the optical path. Input MUST
    be a full optical-slice payload (not just src/dst names). If `tapi-common:context.uuid` is missing, server auto-generates
    it.
  schema:
    type: object
    properties:
      slice_id:
        type: string
        description: Identifier for the optical slice
      slice:
        type: object
        description: Optical-slice request body (TFS optical-slice schema). Include `tapi-common:context` with service-interface-points/constraints
          as required by controller; uuid may be omitted and will be generated.
    required:
    - slice_id
    - slice
  method: POST
  path: /restconf/optical-slice/v1/service/{slice_id}
  body:
    arg: slice
    ensure_uuid: tapi-common:context.uuid
- name: tfs_dscm_oc_get
  description: RESTCONF GET on a per-device OpenConfig YANG path used for optical / DSCM (Dynamic Spectrum & Capacity
    Management) configuration (GET /restconf/data/device=<device_uuid>/<rc_path>). Use this to read optical-channel
    state - e.g. frequency, operational-mode, target-output-power - from a transponder or ROADM.
  schema:
    type: object
    properties:
      device_uuid:
        type: string
        description: Target device UUID
      rc_path:
        type: string
        description: OpenConfig RESTCONF path under the device, e.g. 'openconfig-platform:components/component=och-1/optical-channel/config'.
    required:
    - device_uuid
    - rc_path
  method: GET
  path: /restconf/data/device={device_uuid}/{rc_path}
  strip:
    rc_path: /
- name: tfs_dscm_oc_post
  description: RESTCONF POST to push an OpenConfig optical-channel / spectrum configuration onto a device (POST
    /restconf/data/device=<device_uuid>/<rc_path>). Use this to configure center frequency, operational-mode, target
    output power and other DSCM-OC parameters on a transponder or ROADM.
  schema:
    type: object
    properties:
      device_uuid:
        type: string
        description: Target device UUID
      rc_path:
        type: string
        description: OpenConfig RESTCONF path under the device
      config:
        type: object
        description: 'YANG-data+json payload to push (OpenConfig optical-channel config, e.g. {''openconfig-terminal-device:optical-channel'':
          {''config'': {''frequency'': 193100000, ''target-output-power'': -1.0, ''operational-mode'': 1}}}).'
    required:
    - device_uuid
    - rc_path
    - config
  method: POST
  path: /restconf/data/device={device_uuid}/{rc_path}
  strip:
    rc_path: /
  body:
    arg: config
- name: tfs_dscm_oc_delete
  description: RESTCONF DELETE on a per-device OpenConfig path (DELETE /restconf/data/device=<device_uuid>/<rc_path>).
    Use this to remove an optical-channel / spectrum configuration from a transponder or ROADM.
  schema:
    type: object
    properties:
      device_uuid:
        type: string
        description: Target device UUID
      rc_path:
        type: string
        description: OpenConfig RESTCONF path under the device
    required:
    - device_uuid
    - rc_path
  method: DELETE
  path: /restconf/data/device={device_uuid}/{rc_path}
  strip:
    rc_path: /
- name: tfs_list_all_connections
  description: 'List all Connections in a Context by discovering services first and then retrieving each service''s
    connections. Use this read-only tool for questions such as ''list existing connections'' when no service UUID
    is provided. Returns: {context_uuid, service_count, connections:[Connection]}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
    required:
    - context_uuid
  steps:
  - as: svc
    method: GET
    path: /tfs-api/context/{context_uuid}/services
  - as: each
    foreach: svc.services.service_id.service_uuid.uuid
    method: GET
    path: /tfs-api/context/{context_uuid}/service/{item}/connections
  reply:
    collect:
      from: each
      field: connections
      as: connections
      count_of: svc.services
      count_as: service_count
      echo:
      - context_uuid
- name: tfs_verify_optical_service_allocation
  description: Verify a Service optical allocation against an expected slot interval. This calls the controller-observed
    optical allocation endpoint and returns match=true only when the service is ACTIVE and the effective selected
    slots fall within the expected band/range.
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      service_uuid:
        type: string
        description: Service UUID
      expected_band:
        type: string
        description: Expected band, e.g. C_BAND or c_slots.
      expected_n_start:
        type: integer
        description: Expected first slot.
      expected_n_end:
        type: integer
        description: Expected last slot.
    required:
    - context_uuid
    - service_uuid
    - expected_band
    - expected_n_start
    - expected_n_end
  steps:
  - as: allocation
    method: GET
    path: /tfs-api/context/{context_uuid}/service/{service_uuid}/optical_allocation
  reply:
    raw: true
