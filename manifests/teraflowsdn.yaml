# A controller manifest in the standard form (agentic-mcp.controller/v1).
# Upload it to the agentic MCP and onboard the controller.
# MANIFEST_FORMAT.md describes every section.
manifest: agentic-mcp.controller/v1
kind: teraflowsdn
title: TeraFlowSDN
version: '1'
domain: optical
about: 'ETSI TeraFlowSDN, used here as an optical controller (transponders and ROADMs), reached through its NBI (the tfs-api and its RESTCONF connectors). It publishes no description of
  this API, so its operations are the ones in this manifest.'
recognise:
  fingerprint: /tfs-api/contexts
api:
  style: tfs
defaults:
  context_uuid: admin
  topology_uuid: admin
quirks:
- Setting a transponder's operational mode through update_opticalconfig is accepted and silently dropped; channel
  frequency and target output power are applied.
- Deleting an optical service removes one layer per request, so the delete is repeated until the service is gone.
- Slot 0 of every fibre is always marked used, and slots stay marked used after the service that held them is removed.
- Its C band is 384 slots of 12.5 GHz from 191.325 THz.
- A failed request is answered as JSON with status error, not as an HTTP error from the tool.
guide: A service on TeraFlowSDN is an optical connectivity service between two transponder ports, created in the
  admin context. Spectrum is chosen by TeraFlowSDN unless an optical-spectrum-reservation constraint names the slots.
verbs:
  read_devices:
    operation: GET /tfs-api/devices
    view:
      rows: devices
      id: device_id.device_uuid.uuid
      name: name
      type: device_type
      status: device_operational_status
  read_device:
    operation: GET /tfs-api/device/{device_uuid}
  read_links:
    operation: GET /tfs-api/links
    view:
      rows: links
      id: link_id.link_uuid.uuid
      name: name
  read_services:
    operation: GET /tfs-api/context/{context_uuid}/services
    view:
      rows: services
      id: service_id.service_uuid.uuid
      name: name
      status: service_status.service_status
      type: service_type
  read_service:
    operation: GET /tfs-api/context/{context_uuid}/service/{service_uuid}
  read_spectrum:
    operation: GET /tfs-api/optical_links
    view:
      rows: optical_links
      name: name
  compute_path:
    operation: POST /tfs-api/context/{context_uuid}/topology/{topology_uuid}/optical_connectivity_candidates
    reads: true
  health:
    operation: GET /tfs-api/context_ids
  provision:
    operation: POST /tfs-api/context/{context_uuid}/services
    arguments:
      services: a list of services in TeraFlowSDN's own form
    body:
      services: $services
  adjust:
    operation: PUT /tfs-api/context/{context_uuid}/service/{service_uuid}
    arguments:
      service: the whole service, changed
    body: $service
  teardown:
    operation: DELETE /tfs-api/context/{context_uuid}/service/{service_uuid}
  configure_device:
    operation: PUT /tfs-api/device/{device_uuid}
    arguments:
      device: the whole device, changed
    body: $device
provides:
  read_devices: tfs_list_devices
  read_device: tfs_get_device
  read_links: tfs_list_links
  read_services: tfs_list_services
  read_service: tfs_get_service
  compute_path: tfs_compute_optical_connectivity_candidates
  read_spectrum: tfs_list_optical_links
  provision: tfs_create_services
  adjust: tfs_update_service
  teardown: tfs_delete_service
  health: tfs_health_check
  configure_device: tfs_configure_device
not_carried_over:
- tfs_delete_optical_service
- tfs_optical_add_flex_lightpath
- tfs_optical_add_lightpath
- tfs_optical_create_alarm_subscription
- tfs_optical_del_flex_lightpath
- tfs_optical_del_lightpath
- tfs_optical_del_optical_band
- tfs_optical_delete_alarm_subscription
- tfs_optical_get_alarm_notifications
- tfs_optical_get_alarm_subscriptions
- tfs_optical_get_optical_band
- tfs_optical_get_tapi_topology
- tfs_optical_list_lightpaths
- tfs_optical_list_optical_bands
- tfs_optical_mark_link_failed
- tfs_optical_p2mp_add_lightpath
- tfs_optical_p2mp_add_source
- tfs_optical_p2mp_compute
- tfs_optical_p2mp_del_lightpath
- tfs_optical_p2mp_delete
- tfs_optical_p2mp_get_active_paths
- tfs_optical_p2mp_recompute
- tfs_optical_p2mp_recompute_subflow
- tfs_provision_optical_service
tools:
- name: tfs_list_context_ids
  description: 'List all TFS Context IDs (GET /tfs-api/context_ids). Returns: {context_ids:[{context_uuid:{uuid}}]}'
  schema:
    type: object
    properties: {}
    required: []
  method: GET
  path: /tfs-api/context_ids
- name: tfs_list_contexts
  description: 'List all TFS Contexts with full details (GET /tfs-api/contexts). Returns: {contexts:[{context_id,
    name, topology_ids, service_ids, slice_ids}]}'
  schema:
    type: object
    properties: {}
    required: []
  method: GET
  path: /tfs-api/contexts
- name: tfs_set_contexts
  description: 'Create / update one or more TFS Contexts (POST /tfs-api/contexts). Returns: {context_ids:[ContextId]}'
  schema:
    type: object
    properties:
      contexts:
        type: array
        items:
          type: object
          description: 'Context proto message (JSON). Returns: {context_id:{context_uuid:{uuid}}, name, topology_ids:[{context_id,topology_uuid}],
            service_ids:[{context_id,service_uuid}], slice_ids:[{context_id,slice_uuid}]}'
          properties:
            context_id:
              type: object
              description: ContextId
              properties:
                context_uuid:
                  type: object
                  properties:
                    uuid:
                      type: string
                  required:
                  - uuid
              required:
              - context_uuid
            name:
              type: string
            topology_ids:
              type: array
              items:
                type: object
                description: TopologyId
                properties:
                  context_id:
                    type: object
                    description: ContextId
                    properties:
                      context_uuid:
                        type: object
                        properties:
                          uuid:
                            type: string
                        required:
                        - uuid
                    required:
                    - context_uuid
                  topology_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - context_id
                - topology_uuid
            service_ids:
              type: array
              items:
                type: object
                description: ServiceId
                properties:
                  context_id:
                    type: object
                    description: ContextId
                    properties:
                      context_uuid:
                        type: object
                        properties:
                          uuid:
                            type: string
                        required:
                        - uuid
                    required:
                    - context_uuid
                  service_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - context_id
                - service_uuid
            slice_ids:
              type: array
              items:
                type: object
                description: SliceId
                properties:
                  context_id:
                    type: object
                    description: ContextId
                    properties:
                      context_uuid:
                        type: object
                        properties:
                          uuid:
                            type: string
                        required:
                        - uuid
                    required:
                    - context_uuid
                  slice_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - context_id
                - slice_uuid
          required:
          - context_id
        description: List of Context proto messages
    required:
    - contexts
  method: POST
  path: /tfs-api/contexts
  body:
    wrap: contexts
    arg: contexts
- name: tfs_get_dummy_contexts
  description: 'Get a single aggregated snapshot with all contexts, topologies, devices, links, slices, services,
    and connections (GET /tfs-api/dummy_contexts). Returns: {contexts:[Context], topologies:[Topology], devices:[Device],
    links:[Link], slices:[Slice], services:[Service], connections:[Connection]}'
  schema:
    type: object
    properties: {}
    required: []
  method: GET
  path: /tfs-api/dummy_contexts
- name: tfs_get_context
  description: 'Get a specific TFS Context by UUID (GET /tfs-api/context/<context_uuid>). Returns: Context {context_id,
    name, topology_ids, service_ids, slice_ids}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
    required:
    - context_uuid
  method: GET
  path: /tfs-api/context/{context_uuid}
- name: tfs_set_context
  description: 'Create / update a TFS Context (PUT /tfs-api/context/<context_uuid>). Returns: ContextId {context_uuid:{uuid}}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      context:
        type: object
        description: 'Context proto message (JSON). Returns: {context_id:{context_uuid:{uuid}}, name, topology_ids:[{context_id,topology_uuid}],
          service_ids:[{context_id,service_uuid}], slice_ids:[{context_id,slice_uuid}]}'
        properties:
          context_id:
            type: object
            description: ContextId
            properties:
              context_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - context_uuid
          name:
            type: string
          topology_ids:
            type: array
            items:
              type: object
              description: TopologyId
              properties:
                context_id:
                  type: object
                  description: ContextId
                  properties:
                    context_uuid:
                      type: object
                      properties:
                        uuid:
                          type: string
                      required:
                      - uuid
                  required:
                  - context_uuid
                topology_uuid:
                  type: object
                  properties:
                    uuid:
                      type: string
                  required:
                  - uuid
              required:
              - context_id
              - topology_uuid
          service_ids:
            type: array
            items:
              type: object
              description: ServiceId
              properties:
                context_id:
                  type: object
                  description: ContextId
                  properties:
                    context_uuid:
                      type: object
                      properties:
                        uuid:
                          type: string
                      required:
                      - uuid
                  required:
                  - context_uuid
                service_uuid:
                  type: object
                  properties:
                    uuid:
                      type: string
                  required:
                  - uuid
              required:
              - context_id
              - service_uuid
          slice_ids:
            type: array
            items:
              type: object
              description: SliceId
              properties:
                context_id:
                  type: object
                  description: ContextId
                  properties:
                    context_uuid:
                      type: object
                      properties:
                        uuid:
                          type: string
                      required:
                      - uuid
                  required:
                  - context_uuid
                slice_uuid:
                  type: object
                  properties:
                    uuid:
                      type: string
                  required:
                  - uuid
              required:
              - context_id
              - slice_uuid
        required:
        - context_id
    required:
    - context_uuid
    - context
  method: PUT
  path: /tfs-api/context/{context_uuid}
  body:
    arg: context
- name: tfs_delete_context
  description: 'Delete a TFS Context (DELETE /tfs-api/context/<context_uuid>). Returns: {}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
    required:
    - context_uuid
  method: DELETE
  path: /tfs-api/context/{context_uuid}
- name: tfs_list_topology_ids
  description: 'List Topology IDs within a Context (GET /tfs-api/context/<context_uuid>/topology_ids). Returns:
    {topology_ids:[{context_id, topology_uuid:{uuid}}]}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
    required:
    - context_uuid
  method: GET
  path: /tfs-api/context/{context_uuid}/topology_ids
- name: tfs_list_topologies
  description: 'List Topologies within a Context (GET /tfs-api/context/<context_uuid>/topologies). Returns: {topologies:[{topology_id,
    name, device_ids, link_ids}]}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
    required:
    - context_uuid
  method: GET
  path: /tfs-api/context/{context_uuid}/topologies
- name: tfs_set_topologies
  description: 'Create / update Topologies within a Context (POST /tfs-api/context/<context_uuid>/topologies). Returns:
    {topology_ids:[TopologyId]}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      topologies:
        type: array
        items:
          type: object
          description: 'Topology proto message (JSON). Returns: {topology_id:{context_id,topology_uuid}, name, device_ids:[{device_uuid}],
            link_ids:[{link_uuid}]}'
          properties:
            topology_id:
              type: object
              description: TopologyId
              properties:
                context_id:
                  type: object
                  description: ContextId
                  properties:
                    context_uuid:
                      type: object
                      properties:
                        uuid:
                          type: string
                      required:
                      - uuid
                  required:
                  - context_uuid
                topology_uuid:
                  type: object
                  properties:
                    uuid:
                      type: string
                  required:
                  - uuid
              required:
              - context_id
              - topology_uuid
            name:
              type: string
            device_ids:
              type: array
              items:
                type: object
                description: DeviceId
                properties:
                  device_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - device_uuid
            link_ids:
              type: array
              items:
                type: object
                description: LinkId
                properties:
                  link_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - link_uuid
          required:
          - topology_id
    required:
    - context_uuid
    - topologies
  method: POST
  path: /tfs-api/context/{context_uuid}/topologies
  body:
    wrap: topologies
    arg: topologies
- name: tfs_get_topology
  description: 'Get a Topology (GET /tfs-api/context/<context_uuid>/topology/<topology_uuid>). Returns: Topology
    {topology_id, name, device_ids:[DeviceId], link_ids:[LinkId]}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      topology_uuid:
        type: string
        description: Topology UUID
    required:
    - context_uuid
    - topology_uuid
  method: GET
  path: /tfs-api/context/{context_uuid}/topology/{topology_uuid}
- name: tfs_set_topology
  description: 'Create / update a specific Topology (PUT /tfs-api/context/<context_uuid>/topology/<topology_uuid>).
    Returns: TopologyId {context_id, topology_uuid:{uuid}}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      topology_uuid:
        type: string
        description: Topology UUID
      topology:
        type: object
        description: 'Topology proto message (JSON). Returns: {topology_id:{context_id,topology_uuid}, name, device_ids:[{device_uuid}],
          link_ids:[{link_uuid}]}'
        properties:
          topology_id:
            type: object
            description: TopologyId
            properties:
              context_id:
                type: object
                description: ContextId
                properties:
                  context_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - context_uuid
              topology_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - context_id
            - topology_uuid
          name:
            type: string
          device_ids:
            type: array
            items:
              type: object
              description: DeviceId
              properties:
                device_uuid:
                  type: object
                  properties:
                    uuid:
                      type: string
                  required:
                  - uuid
              required:
              - device_uuid
          link_ids:
            type: array
            items:
              type: object
              description: LinkId
              properties:
                link_uuid:
                  type: object
                  properties:
                    uuid:
                      type: string
                  required:
                  - uuid
              required:
              - link_uuid
        required:
        - topology_id
    required:
    - context_uuid
    - topology_uuid
    - topology
  method: PUT
  path: /tfs-api/context/{context_uuid}/topology/{topology_uuid}
  body:
    arg: topology
- name: tfs_delete_topology
  description: 'Delete a Topology (DELETE /tfs-api/context/<context_uuid>/topology/<topology_uuid>). Returns: {}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      topology_uuid:
        type: string
        description: Topology UUID
    required:
    - context_uuid
    - topology_uuid
  method: DELETE
  path: /tfs-api/context/{context_uuid}/topology/{topology_uuid}
- name: tfs_get_topology_details
  description: 'Get Topology with fully populated devices and links (GET /tfs-api/context/<context_uuid>/topology_details/<topology_uuid>).
    Returns: TopologyDetails {topology_id, name, devices:[Device (full)], links:[Link (full)]}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      topology_uuid:
        type: string
        description: Topology UUID
    required:
    - context_uuid
    - topology_uuid
  method: GET
  path: /tfs-api/context/{context_uuid}/topology_details/{topology_uuid}
- name: tfs_list_service_ids
  description: 'List Service IDs in a Context (GET /tfs-api/context/<context_uuid>/service_ids). Returns: {service_ids:[{context_id,
    service_uuid:{uuid}}]}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
    required:
    - context_uuid
  method: GET
  path: /tfs-api/context/{context_uuid}/service_ids
- name: tfs_list_services
  description: 'List Services in a Context (GET /tfs-api/context/<context_uuid>/services). Returns: {services:[Service
    {service_id, name, service_type, service_endpoint_ids, service_constraints, service_status, service_config}]}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
    required:
    - context_uuid
  method: GET
  path: /tfs-api/context/{context_uuid}/services
- name: tfs_create_services
  description: 'Create one or more Services in a Context (POST /tfs-api/context/<context_uuid>/services). Returns:
    {service_ids:[ServiceId]}'
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      services:
        type: array
        items:
          type: object
          description: 'Service proto message (JSON). service_type (ServiceTypeEnum): 0=UNKNOWN, 1=L3NM, 2=L2NM,
            3=TAPI_CONNECTIVITY_SERVICE, 4=TE, 5=E2E, 6=OPTICAL_CONNECTIVITY, 7=QKD, 8=L1NM, 9=INT, 10=ACL, 11=IP_LINK,
            12=TAPI_LSP, 13=IPOWDM, 14=UPF. service_status.service_status (ServiceStatusEnum): 0=UNDEFINED, 1=PLANNED,
            2=ACTIVE, 3=UPDATING, 4=PENDING_REMOVAL, 5=SLA_VIOLATED. Returns: {service_id, name, service_type, service_endpoint_ids:[EndPointId],
            service_constraints:[Constraint], service_status, service_config:{config_rules}, timestamp}'
          properties:
            service_id:
              type: object
              description: ServiceId
              properties:
                context_id:
                  type: object
                  description: ContextId
                  properties:
                    context_uuid:
                      type: object
                      properties:
                        uuid:
                          type: string
                      required:
                      - uuid
                  required:
                  - context_uuid
                service_uuid:
                  type: object
                  properties:
                    uuid:
                      type: string
                  required:
                  - uuid
              required:
              - context_id
              - service_uuid
            name:
              type: string
            service_type:
              oneOf:
              - type: integer
              - type: string
              description: ServiceTypeEnum value
            service_endpoint_ids:
              type: array
              items:
                type: object
                description: 'EndPointId: identifies a device port/interface within a topology'
                properties:
                  topology_id:
                    type: object
                    description: TopologyId
                    properties:
                      context_id:
                        type: object
                        description: ContextId
                        properties:
                          context_uuid:
                            type: object
                            properties:
                              uuid:
                                type: string
                            required:
                            - uuid
                        required:
                        - context_uuid
                      topology_uuid:
                        type: object
                        properties:
                          uuid:
                            type: string
                        required:
                        - uuid
                    required:
                    - context_id
                    - topology_uuid
                  device_id:
                    type: object
                    description: DeviceId
                    properties:
                      device_uuid:
                        type: object
                        properties:
                          uuid:
                            type: string
                        required:
                        - uuid
                    required:
                    - device_uuid
                  endpoint_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
            service_constraints:
              type: array
              items:
                type: object
                description: 'Constraint - action: 1=SET, 2=DELETE. Include exactly one constraint field.'
                properties:
                  action:
                    oneOf:
                    - type: integer
                    - type: string
                    description: 'ConstraintActionEnum: 1=SET, 2=DELETE'
                  custom:
                    type: object
                    properties:
                      constraint_type:
                        type: string
                      constraint_value:
                        type: string
                  sla_capacity:
                    type: object
                    properties:
                      capacity_gbps:
                        type: number
                  sla_latency:
                    type: object
                    properties:
                      e2e_latency_ms:
                        type: number
                  sla_availability:
                    type: object
                    properties:
                      num_disjoint_paths:
                        type: integer
                      all_active:
                        type: boolean
                      availability:
                        type: number
                        description: 0.0-100.0 %
                  endpoint_location:
                    type: object
                    properties:
                      endpoint_id:
                        type: object
                        description: 'EndPointId: identifies a device port/interface within a topology'
                        properties:
                          topology_id:
                            type: object
                            description: TopologyId
                            properties:
                              context_id:
                                type: object
                                description: ContextId
                                properties:
                                  context_uuid:
                                    type: object
                                    properties:
                                      uuid:
                                        type: string
                                    required:
                                    - uuid
                                required:
                                - context_uuid
                              topology_uuid:
                                type: object
                                properties:
                                  uuid:
                                    type: string
                                required:
                                - uuid
                            required:
                            - context_id
                            - topology_uuid
                          device_id:
                            type: object
                            description: DeviceId
                            properties:
                              device_uuid:
                                type: object
                                properties:
                                  uuid:
                                    type: string
                                required:
                                - uuid
                            required:
                            - device_uuid
                          endpoint_uuid:
                            type: object
                            properties:
                              uuid:
                                type: string
                            required:
                            - uuid
                      location:
                        type: object
                        properties:
                          region:
                            type: string
                          gps_position:
                            type: object
                            properties:
                              latitude:
                                type: number
                              longitude:
                                type: number
                required:
                - action
            service_status:
              type: object
              properties:
                service_status:
                  oneOf:
                  - type: integer
                  - type: string
                  description: ServiceStatusEnum value
            service_config:
              type: object
              properties:
                config_rules:
                  type: array
                  items:
                    type: object
                    description: 'ConfigRule - action: 1=SET, 2=DELETE'
                    properties:
                      action:
                        oneOf:
                        - type: integer
                        - type: string
                        description: 'ConfigActionEnum: 1=CONFIGACTION_SET, 2=CONFIGACTION_DELETE'
                      custom:
                        type: object
                        description: Custom key/value pair config rule
                        properties:
                          resource_key:
                            type: string
                            description: Config path, e.g. '/endpoints/endpoint[uuid]/<uuid>/name'
                          resource_value:
                            type: string
                            description: JSON-serialised value string
                    required:
                    - action
          required:
          - service_id
    required:
    - context_uuid
    - services
  method: POST
  path: /tfs-api/context/{context_uuid}/services
  body:
