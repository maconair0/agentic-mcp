- name: tfs_create_optical_spectrum_reservation
  description: Create a tentative controller-side optical spectrum reservation (POST /tfs-api/context/<context_uuid>/optical_spectrum_reservations).
    TFS rejects overlapping active reservations or occupied slots with HTTP 409. This is the MCP operation to block
    negotiated slots before service creation.
  schema:
    type: object
    properties:
      context_uuid:
        type: string
        description: Context UUID (default 'admin')
      reservation:
        type: object
        description: OpticalSpectrumReservation. Required fields for creation are reservation_id, topology_id, optical_link_ids,
          band, n_start, n_end, required_slots, owner_id, correlation_id, and usually status=1 (RESERVED). Consume
          requests may include service_id and/or connection_id.
        properties:
          reservation_id:
            type: object
            properties:
              context_id:
                type: object
                description: ContextId
                properties:
                  context_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - context_uuid
              reservation_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - context_id
            - reservation_uuid
          topology_id:
            type: object
            description: TopologyId
            properties:
              context_id:
                type: object
                description: ContextId
                properties:
                  context_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - context_uuid
              topology_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - context_id
            - topology_uuid
          optical_link_ids:
            type: array
            items:
              type: object
              description: LinkId
              properties:
                link_uuid:
                  type: object
                  properties:
                    uuid:
                      type: string
                  required:
                  - uuid
              required:
              - link_uuid
            description: Optical links whose common slot range is reserved.
          band:
            type: string
            description: Spectrum band, e.g. c_slots.
          n_start:
            type: integer
            description: First flex-grid slot index.
          n_end:
            type: integer
            description: Last flex-grid slot index, inclusive.
          required_slots:
            type: integer
            description: Number of contiguous slots.
          owner_id:
            type: string
            description: Agent or workflow owning the reservation.
          correlation_id:
            type: string
            description: Workflow/request correlation identifier.
          status:
            oneOf:
            - type: integer
            - type: string
            description: OpticalSpectrumReservationStatusEnum.
          service_id:
            type: object
            description: ServiceId
            properties:
              context_id:
                type: object
                description: ContextId
                properties:
                  context_uuid:
                    type: object
                    properties:
                      uuid:
                        type: string
                    required:
                    - uuid
                required:
                - context_uuid
              service_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - context_id
            - service_uuid
          connection_id:
            type: object
            description: ConnectionId
            properties:
              connection_uuid:
                type: object
                properties:
                  uuid:
                    type: string
                required:
                - uuid
            required:
            - connection_uuid
    required:
    - context_uuid
    - reservation
  method: POST
  path: /tfs-api/context/{context_uuid}/optical_spectrum_reservations
  body:
    arg: reservation
