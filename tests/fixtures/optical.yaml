# Test fixture (not a shipped manifest): an optical controller with queued writes.
# A controller manifest in the standard form (agentic-mcp.controller/v1).
# Upload it to the agentic MCP and onboard the controller.
# MANIFEST_FORMAT.md describes every section.
manifest: agentic-mcp.controller/v1
kind: optical
title: Example optical controller
version: '1'
domain: optical
about: 'A test fixture: an OpenROADM optical controller that publishes its API, used by the tests only.'
recognise:
  operation_contains: example-pce:path-computation-request
api:
  style: json
  openapi:
  - /openapi/api/v3/single
quirks:
- After any service-create or service-delete, the controller treats the result of the next path computation as the
  answer to that service and renders it onto the devices. A service-feasibility-check has to be sent first to stop
  that.
- It works on one service at a time. A second create or delete sent while one is being set up or taken down replaces
  the first one's input and the first never reaches inService.
- A request that fails validation is answered HTTP 200 with an error inside the body, which reads as success and
  is not.
- An empty list in its datastore is answered 409 data-missing, not an empty list.
- 'The free spectrum is not in an operation of its own. It is in the topology: the available frequency maps of each
  degree in the openroadm-topology network.'
- It fills its own lightpaths from the top of the band downwards.
limits:
  service creates per hour: 4
  service deletes per hour: 2
guide: A service on the controller is a lightpath between two transponders (or two ROADM ports), created with service-create
  and removed with service-delete. Creating one walks the whole renderer and takes one to three minutes; it is in
  service when its operational-state is inService.
verbs:
  read_devices:
    operation: GET /rests/data/example-portmapping:network
    view:
      rows: example-portmapping:network.nodes
      id: node-id
      type: node-info.node-type
      model: node-info.node-model
  read_ports:
    operation: GET /rests/data/example-portmapping:network/nodes={node_id}
  read_links:
    operation: GET /rests/data/ietf-network:networks/network=openroadm-topology
    view:
      rows: ietf-network:network.ietf-network-topology:link
      id: link-id
      src: source.source-node
      dst: destination.dest-node
      type: org-openroadm-common-network:link-type
  read_services:
    operation: GET /rests/data/org-openroadm-service:service-list
    view:
      rows: org-openroadm-service:service-list.services
      id: service-name
      name: service-name
      status: operational-state
      a_end: service-a-end.node-id
      z_end: service-z-end.node-id
  read_service:
    operation: GET /rests/data/org-openroadm-service:service-list/services={name}
  read_spectrum:
    operation: GET /rests/data/ietf-network:networks/network=openroadm-topology
    why: The free frequencies are the avail-freq-maps of each degree and SRG in this topology.
  read_alarms:
    operation: GET /rests/data/org-openroadm-alarm:active-alarm-list
  health:
    operation: GET /rests/data/ietf-yang-library:yang-library
  check_feasibility:
    operation: POST /rests/operations/org-openroadm-service:service-feasibility-check
    reads: true
  compute_path:
    operation: POST /rests/operations/example-pce:path-computation-request
    reads: true
    why: Send a service-feasibility-check first; see what to know about it.
  provision:
    operation: POST /rests/operations/org-openroadm-service:service-create
    policy:
      max_per_hour: 4
  adjust:
    operation: POST /rests/operations/org-openroadm-service:service-reconfigure
    policy:
      max_per_hour: 2
  reroute:
    operation: POST /rests/operations/org-openroadm-service:service-reroute
    policy:
      max_per_hour: 2
  teardown:
    operation: POST /rests/operations/org-openroadm-service:service-delete
    arguments:
      name: the service's name
    policy:
      max_per_hour: 2
    body:
      input:
        sdnc-request-header:
          request-id:
            $concat:
            - delete-
            - $name
          rpc-action: service-delete
          request-system-id: agentic-mcp
        service-delete-req-info:
          service-name: $name
          tail-retention: 'no'
provides:
  read_devices: optical_get_portmapping
  read_device: optical_get_node_status
  read_ports: optical_get_portmapping
  read_links: optical_get_topology
  read_services: optical_list_services
  read_service: optical_get_service
  compute_path: optical_compute_path
  read_spectrum: optical_get_topology
  provision: optical_service_create
  teardown: optical_service_delete
  health: optical_health_check
tools:
- name: optical_health_check
  description: Is the controller reachable, and is odl-optical actually installed? A Karaf that has started but
    not finished installing the feature answers TCP and then 404s every model path, so this reads a model path.
  schema:
    properties: {}
    title: optical_health_checkArguments
    type: object
  steps:
  - as: pm
    method: GET
    path: /rests/data/example-portmapping:network
    timeout: 60
    empty_if: data-missing
  reply:
    raw: true
- name: optical_get_topology
  description: 'Summarise a the controller topology: node and link counts, node types, sample ids. network: openroadm-topology
    (default), otn-topology, openroadm-network, clli-network. Pass raw=true for the full OpenROADM payload, which
    is large — a real topology runs to megabytes, so the summary is the default.'
  schema:
    properties:
      network:
        default: openroadm-topology
        title: Network
        type: string
      raw:
        default: false
        title: Raw
        type: boolean
    title: optical_get_topologyArguments
    type: object
  steps:
  - as: net
    method: GET
    path: /rests/data/ietf-network:networks/network={network}
    timeout: 60
    empty_if: data-missing
  reply:
    raw: true
- name: optical_get_portmapping
  description: Read the controller's port mapping — its abstraction of each device's ports. node_id narrows it to
    one node. Pass raw=true for every logical-connection-point rather than per-node counts.
  schema:
    properties:
      node_id:
        default: ''
        title: Node Id
        type: string
      raw:
        default: false
        title: Raw
        type: boolean
    title: optical_get_portmappingArguments
    type: object
  defaults:
    suffix: ''
  steps:
  - as: pm
    method: GET
    path: /rests/data/example-portmapping:network{suffix}
    timeout: 60
    empty_if: data-missing
  reply:
    raw: true
- name: optical_get_node_status
  description: Whether a mounted NETCONF device is connected, and what it advertises. Reads the operational datastore
    (content=nonconfig), which is where the connection status lives — the config view only says what was asked for.
  schema:
    properties:
      node_id:
        title: Node Id
        type: string
      raw:
        default: false
        title: Raw
        type: boolean
    required:
    - node_id
    title: optical_get_node_statusArguments
    type: object
  steps:
  - as: node
    method: GET
    path: /rests/data/network-topology:network-topology/topology=topology-netconf/node={node_id}?content=nonconfig
    timeout: 60
  reply:
    raw: true
- name: optical_list_services
  description: Services the controller currently has provisioned, with their states.
  schema:
    properties:
      raw:
        default: false
        title: Raw
        type: boolean
    title: optical_list_servicesArguments
    type: object
  steps:
  - as: services
    method: GET
    path: /rests/data/org-openroadm-service:service-list
    timeout: 60
    empty_if: data-missing
  reply:
    raw: true
- name: optical_get_service
  description: One provisioned service in full, by name.
  schema:
    properties:
      service_name:
        title: Service Name
        type: string
      raw:
        default: false
        title: Raw
        type: boolean
    required:
    - service_name
    title: optical_get_serviceArguments
    type: object
  steps:
  - as: service
    method: GET
    path: /rests/data/org-openroadm-service:service-list/services={service_name}
    timeout: 60
  reply:
    raw: true
- name: optical_compute_path
  description: 'Ask the PCE for a path. Advisory: computes, reserves nothing. Each endpoint needs at least service-format
    (Ethernet, OTU, OC, STM, OMS, ODU, OTM, flexo, other) and clli, plus service-rate in Gbps unless the format
    is OMS. node-id is optional here and required to provision. pce_routing_metric: hop-count, propagation-delay,
    TE-metric, IGP-metric. resource-reserve is forced to false. Reserving holds resources in the controller''s topology
    until cancelled, which is a change to it — and this tool is on the read side of the split.'
  schema:
    properties:
      service_name:
        title: Service Name
        type: string
      service_a_end:
        additionalProperties: true
        title: Service A End
        type: object
      service_z_end:
        additionalProperties: true
        title: Service Z End
        type: object
      pce_routing_metric:
        default: ''
        title: Pce Routing Metric
        type: string
      raw:
        default: false
        title: Raw
        type: boolean
    required:
    - service_name
    - service_a_end
    - service_z_end
    title: optical_compute_pathArguments
    type: object
  defaults:
    pce_routing_metric: hop-count
  steps:
  - as: services
    method: GET
    path: /rests/data/org-openroadm-service:service-list
    timeout: 60
    empty_if: data-missing
    error: busy
    expect:
      at: org-openroadm-service:service-list.services.operational-state
      all_equal: inService
      say: 'UNAVAILABLE: a service is not in service yet (being set up or taken down); a path computation now would
        disturb it. Ask again shortly'
    quiet_after:
    - action: optical_service_create
      for_s: 30
      until: listed
      named_by: service-name
      say: 'UNAVAILABLE: service {target} is being set up; a path computation now would disturb it. Ask again shortly'
    - action: optical_service_delete
      for_s: 300
      until: gone
      named_by: service-name
      say: 'UNAVAILABLE: service {target} is being taken down; a path computation now would disturb it. Ask again
        shortly'
  - as: armed
    method: POST
    path: /rests/operations/org-openroadm-service:service-feasibility-check
    body:
      template:
        input:
          sdnc-request-header:
            request-id: agentic-mcp-quiet
            rpc-action: service-feasibility-check
            request-system-id: agentic-mcp
          common-id: agentic-mcp-quiet
          connection-type: service
          service-a-end:
            service-format: Ethernet
            service-rate: 100
            clli: agentic-mcp-quiet-a
            node-id: agentic-mcp-quiet-a
            optic-type: gray
            tx-direction:
            - index: 0
              port:
                port-device-name: agentic-mcp-quiet-a
                port-type: fixed
                port-name: quiet
                port-rack: '000000.00'
                port-shelf: '00'
            rx-direction:
            - index: 0
              port:
                port-device-name: agentic-mcp-quiet-a
                port-type: fixed
                port-name: quiet
                port-rack: '000000.00'
                port-shelf: '00'
          service-z-end:
            service-format: Ethernet
            service-rate: 100
            clli: agentic-mcp-quiet-z
            node-id: agentic-mcp-quiet-z
            optic-type: gray
            tx-direction:
            - index: 0
              port:
                port-device-name: agentic-mcp-quiet-z
                port-type: fixed
                port-name: quiet
                port-rack: '000000.00'
                port-shelf: '00'
            rx-direction:
            - index: 0
              port:
                port-device-name: agentic-mcp-quiet-z
                port-type: fixed
                port-name: quiet
                port-rack: '000000.00'
                port-shelf: '00'
    timeout: 180
    error: busy
    expect:
      find: response-code
      all_equal: '200'
      required: true
      say: 'UNAVAILABLE: the controller could not be put in feasibility mode, so a path computation is not known to
        be harmless'
  - as: path
    method: POST
    path: /rests/operations/example-pce:path-computation-request
    body:
      template:
        input:
          service-name: $service_name
          resource-reserve: false
          service-handler-header:
            request-id: $service_name
          service-a-end: $service_a_end
          service-z-end: $service_z_end
          pce-routing-metric: $pce_routing_metric
    timeout: 180
  reply:
    raw: true
- name: optical_describe_models
  description: What the YANG models require, so a caller need not guess. Which fields are mandatory, which enums
    are legal, and the two places the documentation and the models disagree.
  schema:
    properties: {}
    title: optical_describe_modelsArguments
    type: object
  steps: []
  reply:
    const:
      ok: true
      data:
        service_formats:
        - Ethernet
        - OTU
        - OC
        - STM
        - OMS
        - ODU
        - OTM
        - other
        - flexo
        - flexo-x
        - flexo-xe
        pce_metrics:
        - hop-count
        - propagation-delay
        - TE-metric
        - IGP-metric
        networks:
        - openroadm-topology
        - otn-topology
        - openroadm-network
        - clli-network
        connection_types:
        - service
        - infrastructure
        - roadm-line
        path_computation_mandatory:
        - service-name
        - resource-reserve
        - service-handler-header.request-id
        - service-a-end.service-format
        - service-a-end.clli
        - service-z-end.service-format
        - service-z-end.clli
        service_create_additionally_requires:
        - node-id
        - tx-direction
        - rx-direction
        - connection-type
        notes:
        - service-rate is mandatory only when service-format is not OMS
        - node-id is optional for path computation and required to provision
        sources:
        - example-pce@2024-02-05.yang
        - example-common-service-path-types@2022-01-18.yang
        - org-openroadm-service-format.yang (OpenROADM MSA)
- name: optical_get_tapi_topology_details
  description: 'TAPI''s abstracted view, for callers that speak TAPI rather than OpenROADM. An RPC by protocol but
    a read by effect. Needs odl-example-tapi installed: without it answers HTTP 500 with "No implementation
    of RPC ... available" rather than a 404, so the failure names a missing feature and not a missing controller.'
  schema:
    properties:
      topology_id:
        default: ''
        title: Topology Id
        type: string
      raw:
        default: false
        title: Raw
        type: boolean
    title: optical_get_tapi_topology_detailsArguments
    type: object
  defaults:
    topology_id: 393f09a4-0a0b-3d82-a4f6-1fbbc14ca1a7
  steps:
  - as: topology
    method: POST
    path: /rests/operations/tapi-topology:get-topology-details
    body:
      template:
        input:
          topology-id: $topology_id
    timeout: 180
  reply:
    raw: true
- name: optical_list_tapi_connectivity_services
  description: TAPI connectivity services currently known to the controller.
  schema:
    properties:
      raw:
        default: false
        title: Raw
        type: boolean
    title: optical_list_tapi_connectivity_servicesArguments
    type: object
  steps:
  - as: services
    method: POST
    path: /rests/operations/tapi-connectivity:get-connectivity-service-list
    body:
      template:
        input: {}
    timeout: 180
  reply:
    raw: true
- name: optical_service_create
  description: Request an OpenROADM service. Queues for operator approval; provisions nothing. Both endpoints need
    service-format, clli, service-rate (unless OMS), node-id, tx-direction and rx-direction — the renderer configures
    real ports, so the directions are not optional here even though the PCE can compute without them. There is no
    argument that skips the approval queue. Creating a service renders cross-connects on live ROADMs, and this tier
    does not decide that such a change is safe.
  schema:
    properties:
      service_name:
        title: Service Name
        type: string
      service_a_end:
        additionalProperties: true
        title: Service A End
        type: object
      service_z_end:
        additionalProperties: true
        title: Service Z End
        type: object
      connection_type:
        default: service
        title: Connection Type
        type: string
    required:
    - service_name
    - service_a_end
    - service_z_end
    title: optical_service_createArguments
    type: object
  queue: true
  verb: provision
  target: '{service_name}'
  defaults:
    connection_type: service
  summary: create OpenROADM service {service_name} ({service_a_end[node-id]} -> {service_z_end[node-id]}, {service_a_end[service-rate]}G)
  steps:
  - as: created
    method: POST
    path: /rests/operations/org-openroadm-service:service-create
    body:
      template:
        input:
          sdnc-request-header:
            request-id: $service_name
            rpc-action: service-create
            request-system-id: agentic-mcp
          service-name: $service_name
          common-id: $service_name
          connection-type: $connection_type
          service-a-end: $service_a_end
          service-z-end: $service_z_end
    timeout: 180
    expect: &id001
      find: response-code
      in:
      - '200'
      - OK
      - Successful
      say: the controller refused it
- name: optical_service_delete
  description: Request deletion of an OpenROADM service. Queues for approval; deletes nothing. Deleting a service
    drops traffic it currently carries, so this is gated more tightly than creating one.
  schema:
    properties:
      service_name:
        title: Service Name
        type: string
    required:
    - service_name
    title: optical_service_deleteArguments
    type: object
  queue: true
  verb: teardown
  target: '{service_name}'
  summary: delete OpenROADM service {service_name}
  steps:
  - as: deleted
    method: POST
    path: /rests/operations/org-openroadm-service:service-delete
    body:
      template:
        input:
          sdnc-request-header:
            request-id:
              $concat:
              - delete-
              - $service_name
            rpc-action: service-delete
            request-system-id: agentic-mcp
          service-delete-req-info:
            service-name: $service_name
            tail-retention: 'no'
    timeout: 180
    expect: *id001
- name: optical_approve_request
  description: Approve and issue one queued write, for a host that confirmed it with a person. Needs the token the
    operator configured on this server (OPTICAL_APPROVER_TOKEN). With none configured this always refuses and approval
    stays with the runner's --approve / --apply-now.
  schema:
    properties:
      approval_id:
        title: Approval Id
        type: string
      approver_token:
        title: Approver Token
        type: string
    required:
    - approval_id
    - approver_token
    title: optical_approve_requestArguments
    type: object
  approve:
    token_env: OPTICAL_APPROVER_TOKEN
- name: optical_device_connect
  description: Request that the controller mount a NETCONF device. Queues for approval. Not traffic-affecting, but
    it puts a device under a controller's authority — and one device owned by two controllers is exactly the conflict
    `dispatcher.managed_elsewhere` exists to catch. So it is gated too, and the queued item records which device
    and which controller.
  schema:
    properties:
      node_id:
        title: Node Id
        type: string
      host:
        title: Host
        type: string
      port:
        default: 830
        title: Port
        type: integer
      username:
        default: ''
        title: Username
        type: string
      password:
        default: ''
        title: Password
        type: string
    required:
    - node_id
    - host
    title: optical_device_connectArguments
    type: object
  queue: true
  target: '{node_id}'
  defaults:
    port: 830
    username: ''
    password: ''
  summary: mount {node_id} ({host}:{port}) on the controller
  check:
    between:
      port:
      - 1
      - 65535
  steps:
  - method: PUT
    timeout: 180
    path: /rests/data/network-topology:network-topology/topology=topology-netconf/node={node_id}
    body:
      template:
        node:
        - node-id: $node_id
          netconf-node-topology:netconf-node:
            netconf-node-topology:host: $host
            netconf-node-topology:port:
              $int: $port
            netconf-node-topology:login-password-unencrypted:
              netconf-node-topology:username: $username
              netconf-node-topology:password: $password
            netconf-node-topology:tcp-only: false
            netconf-node-topology:reconnect-on-changed-schema: false
            netconf-node-topology:connection-timeout-millis: 20000
            netconf-node-topology:max-connection-attempts: 0
